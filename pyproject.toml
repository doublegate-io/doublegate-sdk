[build-system]
requires = ["setuptools>=77,<85"]
build-backend = "setuptools.build_meta"

[project]
name = "doublegate-sdk"
version = "0.1.0.dev2"
description = "Offline declarative gate authoring: evidence, never publication authority."
readme = "README.md"
requires-python = ">=3.11"
license = "Apache-2.0"
license-files = ["LICENSE", "NOTICE"]
authors = [{name = "Eugene Korniichuk"}]
dependencies = []
classifiers = ["Development Status :: 2 - Pre-Alpha", "Programming Language :: Python :: 3", "Operating System :: POSIX"]

[project.optional-dependencies]
test = ["pytest>=9.0.3,<10", "build>=1.2,<2"]
docs = ["mkdocs>=1.6,<2", "mkdocs-material>=9.5,<10", "mkdocstrings[python]>=0.27,<1", "mike>=2,<3"]

[project.urls]
Repository = "https://github.com/doublegate-io/doublegate-sdk"
Documentation = "https://doublegate-io.github.io/doublegate-sdk/"
Issues = "https://github.com/doublegate-io/doublegate-sdk/issues"

[project.scripts]
doublegate-sdk = "doublegate_sdk.__main__:main"

[tool.setuptools.packages.find]
where = ["src"]
include = ["doublegate_sdk*"]

[tool.setuptools.package-data]
doublegate_sdk = ["py.typed"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
