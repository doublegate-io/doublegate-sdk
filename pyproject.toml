[build-system]
requires = ["setuptools>=77,<85"]
build-backend = "setuptools.build_meta"

[project]
name = "doublegate-sdk"
version = "0.1.0.dev5"
description = "Offline declarative gate authoring: evidence, never publication authority."
readme = "README.md"
requires-python = ">=3.11"
license = "Apache-2.0"
license-files = ["LICENSE", "NOTICE"]
authors = [{name = "Eugene Korniichuk"}]
dependencies = []
classifiers = ["Development Status :: 2 - Pre-Alpha", "Programming Language :: Python :: 3", "Operating System :: POSIX"]

[project.optional-dependencies]
identity = ["PyJWT[crypto]==2.13.0", "cryptography==50.0.1"]
test = ["pytest>=9.0.3,<10", "build>=1.2,<2", "pytest-xdist>=3.8,<4"]
docs = ["mkdocs>=1.6,<2", "mkdocs-material>=9.5,<10", "mkdocstrings[python]>=0.27,<1", "mike>=2,<3"]
# Telemetry is optional: the base install stays dependency-free (ADR-0010) and every
# observability call is inert without these. `observability` records locally; adding
# `observability-otlp` is the only thing that can send anything off the host.
observability = [
  "opentelemetry-api>=1.44,<2",
  "opentelemetry-sdk>=1.44,<2",
  # The supported stdlib logging bridge. `opentelemetry.sdk._logs.LoggingHandler` is
  # deprecated in 1.44 in favour of this package's handler; we use the replacement.
  "opentelemetry-instrumentation-logging>=0.65b0,<0.70",
]
observability-otlp = [
  "doublegate-sdk[observability]",
  "opentelemetry-exporter-otlp-proto-http>=1.44,<2",
]

[project.urls]
Repository = "https://github.com/doublegate-io/doublegate-sdk"
Documentation = "https://doublegate-io.github.io/doublegate-sdk/"
Issues = "https://github.com/doublegate-io/doublegate-sdk/issues"

[project.scripts]
doublegate-sdk = "doublegate_sdk.__main__:main"

[tool.setuptools.packages.find]
where = ["src"]
include = ["doublegate_sdk*"]

[tool.setuptools.package-data]
doublegate_sdk = ["py.typed"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q -n auto"
