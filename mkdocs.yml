site_name: Doublegate SDK
site_description: Offline gate authoring. Evidence, never authority.
site_url: !ENV [SDK_DOCS_URL, 'https://doublegate-io.github.io/doublegate-sdk/']
repo_url: https://github.com/doublegate-io/doublegate-sdk
repo_name: doublegate-io/doublegate-sdk
theme:
  name: material
  font: false
  palette:
    scheme: slate
    primary: custom
    accent: custom
  features:
    - navigation.tabs
    - navigation.sections
    - navigation.indexes
    - navigation.top
    - content.code.copy
    - search.suggest
    - search.highlight
plugins:
  - search
  - mkdocstrings:
      handlers:
        python:
          paths: [src]
          options:
            show_source: true
            show_root_heading: true
            show_signature_annotations: true
            separate_signature: true
            members_order: source
            show_if_no_docstring: true
            inherited_members: false
            filters: ["!^_"]
markdown_extensions:
  - admonition
  - attr_list
  - tables
  - pymdownx.details
  - pymdownx.superfences
  - pymdownx.highlight:
      anchor_linenums: true
extra_css: [stylesheets/extra.css]
extra:
  version:
    provider: mike
    default: dev
nav:
  - Start: index.md
  - Get started:
      - Python application: quickstart.md
      - Agent integration (MCP): agents.md
      - HTTP endpoints and migration: http-interfaces.md
  - Starter apps:
      - Choose a use case: use-cases/index.md
      - Assistant memory: use-cases/memory.md
      - Document ingestion: use-cases/ingestion.md
      - Deterministic checks: use-cases/checks.md
      - Reviewer preparation: use-cases/reviewer.md
      - Provenance: use-cases/provenance.md
      - Correction preparation: use-cases/correction.md
      - Diagnostics: use-cases/diagnostics.md
  - Custom checks:
      - Author a deterministic check: manual.md
  - Compatibility & versions: versions.md
  - Roadmap: roadmap.md
  - API reference:
      - Overview: api/index.md
      - Check a file against a manifest: api/authoring.md
      - Gate memory client: api/client.md
      - Manifest: api/manifest.md
      - Load a check manifest: api/package.md
      - Evaluation: api/runtime.md
      - Evidence types: api/checks.md
      - Reason categories: api/reasons.md
      - Response schemas: api/schema.md
      - Skipped reasons: api/skipped.md
      - CLI: api/cli.md
  - Maintainers: maintaining.md
